<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>會員系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #101019; overflow: hidden; font-family: sans-serif; color-scheme: dark; }

    /* 保留歷史 ID；所有平台共用，由 visualViewport 避讓 Android 鍵盤。 */
    #ios-container { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; display: none; -webkit-overflow-scrolling: touch; }
    iframe { width: 100%; height: 100%; border: none; }

    /* 載入動畫 */
    #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; }
    .spinner { border: 4px solid rgba(159,53,255,.15); border-top: 4px solid #b966ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 15px auto; }
    [hidden] { display: none !important; }
    #loader { width: min(90%, 24rem); box-sizing: border-box; padding: 2rem 1rem; }
    .loading-text { color: #f3f1fa; font-size: 1.125rem; font-weight: bold; line-height: 1.6; }
    #line-login-button { margin-top: 1.25rem; border: 0; background: #06a947; color: white; padding: .9rem 1.5rem; border-radius: 1rem; min-height: 48px; font: inherit; font-weight: 700; cursor: pointer; }
    #line-login-button:focus-visible { outline: 3px solid #173a67; outline-offset: 4px; }
    #login-help { margin:1rem 0 0;color:#c3bfce;font-size:.8125rem;line-height:1.65;overflow-wrap:anywhere; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text" id="status-text" role="status" aria-live="polite">系統啟動中...</div>
    <button type="button" id="line-login-button" hidden>使用 LINE 登入</button>
    <p id="login-help">完成 LINE 授權後請回到此頁。若 LINE 內無法載入，可改用手機預設瀏覽器；若希望保留登入，請使用一般瀏覽模式。</p>
  </div>

  <div id="ios-container"></div>

  <script src="./secure-bridge.js?v=20261030-android-member-v4"></script>
  <script src="./secure-member.js?v=20261030-android-member-v4"></script>
</body>
</html>
